<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFM Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-blue-400 mb-4 md:mb-0">Solfunmeme Explorer</h1>
            <div class="flex space-x-4 text-sm items-center">
                <a href="https://github.com/Yku1712/sfm-cf-indexer" target="_blank" class="text-gray-400 hover:text-white underline">GitHub</a>
                <a href="https://sfm-cf-indexer.yku-solfunmeme.workers.dev/api/export" class="bg-green-600 hover:bg-green-500 text-white font-bold py-1 px-3 rounded">Download CSV</a>
                <!-- Wallet Selectors -->
                <button id="btn-phantom" onclick="connectWallet('phantom')" class="bg-[#ab9ff2] hover:bg-[#9b8cf0] text-white font-bold py-1 px-3 rounded transition text-sm">Phantom</button>
                <button id="btn-solflare" onclick="connectWallet('solflare')" class="bg-[#fc7227] hover:bg-[#e6631c] text-white font-bold py-1 px-3 rounded transition text-sm">Solflare</button>
                <button id="btn-other" onclick="connectWallet('other')" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-3 rounded transition text-sm">Other</button>
                
                <!-- Disconnect Button (Hidden by default) -->
                <button id="disconnect-btn" onclick="disconnectWallet()" class="hidden bg-red-600 hover:bg-red-500 text-white font-bold py-1 px-3 rounded transition text-sm">Disconnect</button>
            </div>
        </div>

        <!-- Status Bar & Search -->
        <div class="bg-gray-800 p-4 rounded-lg mb-6 shadow-lg flex flex-col md:flex-row justify-between items-center">
            <div id="status" class="text-sm font-mono text-green-400 mb-4 md:mb-0">Loading...</div>
            <input type="text" id="search-input" placeholder="Search wallet..." class="p-2 bg-gray-700 rounded border border-gray-600 text-white w-full md:w-80 focus:outline-none focus:border-blue-500 text-sm">
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-700 mb-6">
            <button onclick="switchTab('overview')" id="tab-overview" class="px-6 py-2 text-blue-400 border-b-2 border-blue-400 font-bold">Overview</button>
            <button onclick="switchTab('economy')" id="tab-economy" class="px-6 py-2 text-gray-400 hover:text-white">Economy</button>
            <button onclick="switchTab('activity')" id="tab-activity" class="px-6 py-2 text-gray-400 hover:text-white">Activity</button>
        </div>

        <!-- TAB 1: OVERVIEW -->
        <div id="content-overview" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl mb-4 text-blue-300">Holders Ranking</h2>
                <div class="overflow-y-auto h-[600px]">
                    <table class="w-full text-left text-sm">
                        <thead class="text-gray-400 border-b border-gray-700 sticky top-0 bg-gray-800 z-10">
                            <tr><th class="pb-2">Rank</th><th class="pb-2">Address</th><th class="pb-2 text-right">Amount</th></tr>
                        </thead>
                        <tbody id="holders-table" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
            <div class="space-y-6">
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                    <h2 class="text-xl mb-4 text-blue-300">Supply Distribution</h2>
                    <canvas id="supplyChart"></canvas>
                </div>
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl mb-4 text-green-300">Holder Growth</h2>
                    <canvas id="growthChart"></canvas>
                </div>
            </div>
        </div>

        <!-- TAB 2: ECONOMY -->
        <div id="content-economy" class="hidden grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl mb-4 text-yellow-400">🏆 Credit Leaderboard</h2>
                <ul id="leaderboard-list" class="space-y-3 text-sm font-mono"></ul>
            </div>
            <div class="space-y-6">
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl mb-4 text-blue-300">Prove Your Holding</h2>
                    <input type="text" id="wallet-input" placeholder="Wallet Address" class="w-full p-2 mb-2 bg-gray-700 rounded border border-gray-600 text-white text-sm">
                    <input type="number" id="min-input" value="1" placeholder="Min amount" class="w-full p-2 mb-4 bg-gray-700 rounded border border-gray-600 text-white text-sm">
                    <button onclick="checkProof()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded">Check Proof</button>
                    <div id="proof-result" class="mt-4 p-4 bg-gray-900 rounded border border-gray-700 hidden text-sm"></div>
                </div>
                <div id="transfer-panel" class="hidden bg-gray-800 p-6 rounded-lg shadow-lg mt-6">
                    <h2 class="text-xl mb-4 text-purple-300">Secure Transfer</h2>
                    <input type="text" id="transfer-to" placeholder="Recipient Address" class="w-full p-2 mb-2 bg-gray-700 rounded border border-gray-600 text-white text-sm">
                    <input type="number" id="transfer-amount" placeholder="Amount" class="w-full p-2 mb-2 bg-gray-700 rounded border border-gray-600 text-white text-sm">
                    <button onclick="secureTransfer()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded transition">Sign & Send</button>
                    <div id="transfer-result" class="mt-2 text-center text-sm hidden"></div>
                </div>
            </div>
        </div>

        <!-- TAB 3: ACTIVITY -->
        <div id="content-activity" class="hidden grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl mb-4 text-red-400">🐋 Whale Activity (24h)</h2>
                <ul id="whale-list" class="space-y-2 text-sm font-mono"></ul>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl mb-4 text-purple-400">📝 On-Chain Memos</h2>
                <ul id="memo-list" class="space-y-2 text-sm font-mono"></ul>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = "https://sfm-cf-indexer.yku-solfunmeme.workers.dev";
        let chartInstance = null;
        let connectedWallet = null;

        function switchTab(tab) {
            ['overview', 'economy', 'activity'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`content-${t}`).classList.remove('grid');
                document.getElementById(`tab-${t}`).className = "px-6 py-2 text-gray-400 hover:text-white";
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`content-${tab}`).classList.add('grid');
            document.getElementById(`tab-${tab}`).className = "px-6 py-2 text-blue-400 border-b-2 border-blue-400 font-bold";
        }

        async function loadData() {
            try {
                const resHealth = await fetch(`${API_BASE}/api/health`);
                const dataHealth = await resHealth.json();
                document.getElementById('status').innerHTML = `Status: <span class="text-green-400">${dataHealth.status.toUpperCase()}</span> | Tracked: <strong>${dataHealth.total_holders_stored.toLocaleString()}</strong>`;

                const res = await fetch(`${API_BASE}/api/holders?limit=100`);
                const data = await res.json();
                const tbody = document.getElementById('holders-table');
                tbody.innerHTML = "";
                
                let top10Sum = 0, totalSum = 0;
                data.holders.forEach((holder, index) => {
                    if (index < 10) top10Sum += holder.amount;
                    totalSum += holder.amount;
                    const tr = document.createElement('tr');
                    const formattedAmount = (holder.amount / 1000000).toLocaleString(undefined, {maximumFractionDigits: 0});
                    tr.innerHTML = `
                        <td class="py-2 text-gray-500">#${index + 1}</td>
                        <td class="py-2 font-mono text-xs"><a href="https://solscan.io/account/${holder.address}" target="_blank" class="hover:text-blue-400">${holder.address.slice(0, 4)}...${holder.address.slice(-4)}</a></td>
                        <td class="py-2 text-right text-green-400">${formattedAmount}</td>
                    `;
                    tbody.appendChild(tr);
                });
                renderChart(top10Sum, totalSum - top10Sum);
                loadGrowthChart();
            } catch (e) { console.error(e); }
        }

        let growthChartInstance = null;
        async function loadGrowthChart() {
            try {
                const res = await fetch(`${API_BASE}/api/holders/history`);
                const data = await res.json();
                
                const labels = data.history.map(h => h.day);
                const values = data.history.map(h => h.total_holders);

                if (growthChartInstance) growthChartInstance.destroy();
                const ctx = document.getElementById('growthChart').getContext('2d');
                growthChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels.length > 0 ? labels : ['Today'],
                        datasets: [{
                            label: 'Total Holders',
                            data: values.length > 0 ? values : [0],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
                            y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
                        }
                    }
                });
            } catch (e) { console.error("Failed to load growth chart", e); }
        }

        function renderChart(top10, rest) {
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('supplyChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Top 10', 'Rest'], datasets: [{ data: [top10, rest], backgroundColor: ['#3b82f6', '#1e293b'], borderWidth: 0 }] },
                options: { plugins: { legend: { labels: { color: 'white' } } } }
            });
        }

        async function loadLeaderboard() {
            try {
                const res = await fetch(`${API_BASE}/api/leaderboard`);
                const data = await res.json();
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = "";
                data.leaderboard.forEach((user, index) => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center py-1 border-b border-gray-700";
                    li.innerHTML = `<span class="text-gray-400">#${index + 1} <a href="#" onclick="fillProof('${user.address}')" class="hover:text-blue-400">${user.address.slice(0,6)}...${user.address.slice(-4)}</a></span><span class="text-yellow-400 font-bold">${user.balance.toFixed(2)} CR</span>`;
                    list.appendChild(li);
                });
            } catch (e) { console.error(e); }
        }

        async function loadWhales() {
            try {
                const res = await fetch(`${API_BASE}/api/whales/activity?hours=24`);
                const data = await res.json();
                const list = document.getElementById('whale-list');
                list.innerHTML = data.movements.length === 0 ? `<li class="text-gray-500 text-xs">No movements yet.</li>` : "";
                data.movements.slice(0, 8).forEach(m => {
                    const li = document.createElement('li');
                    const color = m.direction === "BUY" ? "text-green-400" : "text-red-400";
                    const icon = m.direction === "BUY" ? "⬆️" : "⬇️";
                    li.className = "flex justify-between py-1 border-b border-gray-700";
                    li.innerHTML = `<span class="text-gray-400 text-xs">${icon} ${m.address.slice(0,6)}...</span><span class="${color} font-bold text-xs">${m.direction === "BUY" ? "+" : ""}${parseFloat(m.delta).toLocaleString()} SFM</span>`;
                    list.appendChild(li);
                });
            } catch (e) { console.error(e); }
        }

        async function loadMemos() {
            try {
                const res = await fetch(`${API_BASE}/api/memos`);
                const data = await res.json();
                const list = document.getElementById('memo-list');
                list.innerHTML = data.memos.length === 0 ? `<li class="text-gray-500 text-xs">No memos yet.</li>` : "";
                data.memos.slice(0, 5).forEach(m => {
                    const li = document.createElement('li');
                    li.className = "py-2 border-b border-gray-700";
                    li.innerHTML = `<span class="text-purple-300 font-bold text-xs italic">"${m.memo}"</span><span class="text-gray-500 text-[10px] block">by ${m.wallet.slice(0,6)}...</span>`;
                    list.appendChild(li);
                });
            } catch (e) { console.error(e); }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#holders-table tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        });

        function fillProof(address) {
            document.getElementById('wallet-input').value = address;
            switchTab('economy');
            checkProof();
        }

        async function connectWallet(type) {
        let provider = null;
        
        if (type === 'phantom') {
            provider = window.phantom?.solana || (window.solana && window.solana.isPhantom ? window.solana : null);
            if (!provider) return alert("Phantom wallet not found! Please install the Phantom extension.");
        } else if (type === 'solflare') {
            provider = window.solflare;
            if (!provider) return alert("Solflare wallet not found! Please install the Solflare extension.");
        } else {
            if (window.backpack) {
                provider = window.backpack;
            } else {
                return alert("No other supported wallets found (like Backpack).");
            }
        }

        try {
            const response = await provider.connect();
            let pubKey = null;
            if (response && response.publicKey) pubKey = response.publicKey;
            else if (provider.publicKey) pubKey = provider.publicKey;
            else if (response) pubKey = response;
            
            if (!pubKey) throw new Error("Could not retrieve public key.");
            connectedWallet = pubKey.toString();
            
            // Ascundem butoanele de conectare
            document.getElementById('btn-phantom').classList.add('hidden');
            document.getElementById('btn-solflare').classList.add('hidden');
            document.getElementById('btn-other').classList.add('hidden');
            
            // Arătăm butonul de deconectare
            const btnDisconnect = document.getElementById('disconnect-btn');
            btnDisconnect.classList.remove('hidden');
            btnDisconnect.innerText = `Disconnect (${connectedWallet.slice(0,4)}...${connectedWallet.slice(-4)})`;
            
            document.getElementById('wallet-input').value = connectedWallet;
            switchTab('economy');
            checkProof();
        } catch (err) {
            alert("Connection failed: " + err.message);
        }
    }

        async function disconnectWallet() {
        const providers = [window.solflare, window.phantom?.solana, window.solana, window.backpack];
        for (const p of providers) {
            if (p && p.disconnect) {
                try { await p.disconnect(); } catch(e) {}
            }
        }
        connectedWallet = null;
        
        // Re-afișăm cele 3 butoane, ascundem butonul de disconnect
        document.getElementById('btn-phantom').classList.remove('hidden');
        document.getElementById('btn-solflare').classList.remove('hidden');
        document.getElementById('btn-other').classList.remove('hidden');
        document.getElementById('disconnect-btn').classList.add('hidden');
        
        document.getElementById('wallet-input').value = '';
        document.getElementById('proof-result').classList.add('hidden');
        document.getElementById('transfer-panel').classList.add('hidden');
        switchTab('overview');
    }

        async function checkProof() {
            const address = document.getElementById('wallet-input').value.trim();
            const min = document.getElementById('min-input').value;
            const resultDiv = document.getElementById('proof-result');
            if (!address) return;

            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = "Verifying (this may take a few seconds to read blockchain history)...";

            try {
                const res = await fetch(`${API_BASE}/api/prove?address=${address}&min=${min}`);
                const data = await res.json();
                if (data.status === "proven") {
                    resultDiv.innerHTML = `
                        <h3 class="text-green-400 font-bold mb-1">✅ Proven</h3>
                        <p class="mb-2">Held <strong>${data.current_balance.toLocaleString()} SFM</strong> for <strong>${data.duration_hours} hours</strong>.</p>
                        <div class="bg-blue-900 p-2 rounded text-center mb-2"><span class="text-xs text-blue-300 block">SCORE</span><span class="text-xl font-bold text-white">${data.holder_score}</span></div>
                        <div class="bg-purple-900 p-2 rounded text-center mb-4"><span class="text-xs text-purple-300 block">CREDITS</span><span class="text-lg font-bold text-white">${data.credit_balance.toFixed(2)} CR</span></div>
                        <button onclick="claimCredits('${address}', '${min}')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded">Claim Daily Credits</button>
                        <div id="claim-result" class="mt-2 text-center text-sm hidden"></div>
                    `;
                } else {
                    resultDiv.innerHTML = `<h3 class="text-red-400 font-bold mb-1">❌ Not Proven</h3><p class="text-xs">${data.message || 'Currently not holding.'}</p>`;
                }
            } catch (e) { resultDiv.innerHTML = "Error verifying proof."; }
        }

        async function claimCredits(address, min) {
            const claimDiv = document.getElementById('claim-result');
            claimDiv.classList.remove('hidden');
            claimDiv.innerHTML = "Processing...";
            try {
                const res = await fetch(`${API_BASE}/api/claim`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, min }) });
                const data = await res.json();
                claimDiv.innerHTML = res.ok ? `<span class="text-green-400 font-bold">${data.message}</span>` : `<span class="text-red-400">${data.message || data.error}</span>`;
                if (res.ok) setTimeout(() => { checkProof(); loadLeaderboard(); }, 2000);
            } catch (e) { claimDiv.innerHTML = `<span class="text-red-400">Error claiming.</span>`; }
        }

        async function secureTransfer() {
            if (!connectedWallet) return alert("Connect wallet first!");
            
            const to = document.getElementById('transfer-to').value.trim();
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const resultDiv = document.getElementById('transfer-result');
            
            if (!to || !amount) {
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `<span class="text-red-400">Fill recipient and amount.</span>`;
                return;
            }

            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = "Waiting for signature...";

            try {
                const provider = window.solflare || window.phantom?.solana;
                const message = `Transfer ${amount} credits to ${to}`;
                const encodedMessage = new TextEncoder().encode(message);
                
                const signedMessage = await provider.signMessage(encodedMessage, "utf8");
                const sigBase64 = btoa(String.fromCharCode(...signedMessage.signature));

                resultDiv.innerHTML = "Verifying...";

                const res = await fetch(`${API_BASE}/api/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from: connectedWallet, to: to, amount: amount, signature: sigBase64, message: message })
                });
                const data = await res.json();

                if (res.ok) {
                    resultDiv.innerHTML = `<span class="text-green-400 font-bold">${data.message}</span>`;
                    loadLeaderboard();
                } else {
                    resultDiv.innerHTML = `<span class="text-red-400">${data.error}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span class="text-red-400">Rejected or error.</span>`;
            }
        }

        // Detect when user switches accounts inside Phantom
        function setupWalletListener() {
        const handleAccountChange = (publicKey) => {
            if (publicKey) {
                connectedWallet = publicKey.toString();
                document.getElementById('disconnect-btn').innerText = `Disconnect (${connectedWallet.slice(0,4)}...${connectedWallet.slice(-4)})`;
                document.getElementById('wallet-input').value = connectedWallet;
                checkProof();
            } else {
                disconnectWallet();
            }
        };

        if (window.phantom?.solana) window.phantom.solana.on('accountChanged', handleAccountChange);
        if (window.solflare) window.solflare.on('accountChanged', handleAccountChange);
        if (window.solana && window.solana.on) window.solana.on('accountChanged', handleAccountChange);
    }

        setupWalletListener();

        loadData(); loadLeaderboard(); loadWhales(); loadMemos();
        setInterval(() => { loadData(); loadLeaderboard(); loadWhales(); loadMemos(); }, 60000);
    </script>
</body>
</html>
