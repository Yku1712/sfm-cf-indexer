<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFM Indexer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-blue-400">Solfunmeme Data Indexer</h1>
            <a href="https://github.com/Yku1712/sfm-cf-indexer" target="_blank" class="text-gray-400 hover:text-white underline text-sm">View GitHub Repo</a>
        </div>

        <div class="bg-gray-800 p-4 rounded-lg mb-8 shadow-lg">
            <h2 class="text-xl mb-2 text-gray-300">System Status</h2>
            <div id="status" class="text-sm font-mono text-green-400">Loading...</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Top Holders -->
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl mb-4 text-blue-300">Top 100 Holders (Out of 3,691)</h2>
                <div class="overflow-y-auto h-[600px]">
                    <table class="w-full text-left text-sm">
                        <thead class="text-gray-400 border-b border-gray-700 sticky top-0 bg-gray-800">
                            <tr>
                                <th class="pb-2">#</th>
                                <th class="pb-2">Address</th>
                                <th class="pb-2 text-right">Amount (Tokens)</th>
                            </tr>
                        </thead>
                        <tbody id="holders-table" class="divide-y divide-gray-700">
                            <!-- Data inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="space-y-8">
                <!-- Chart -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl mb-4 text-blue-300">Supply Distribution</h2>
                    <canvas id="supplyChart"></canvas>
                </div>

                <!-- Proof of Holding -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl mb-4 text-blue-300">Prove Your Holding</h2>
                    <input type="text" id="wallet-input" placeholder="Wallet Address" class="w-full p-2 mb-2 bg-gray-700 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-500">
                    <input type="number" id="min-input" value="1" placeholder="Min amount" class="w-full p-2 mb-4 bg-gray-700 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-500">
                    <button onclick="checkProof()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition">Check Proof</button>
                    <div id="proof-result" class="mt-4 p-4 bg-gray-900 rounded border border-gray-700 hidden text-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://sfm-cf-indexer.yku-solfunmeme.workers.dev";
        let chartInstance = null;

        async function loadStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/health`);
                const data = await res.json();
                document.getElementById('status').innerHTML = `
                    Status: <span class="text-green-400">${data.status.toUpperCase()}</span> | 
                    Total Holders Tracked: <strong>${data.total_holders_stored.toLocaleString()}</strong> | 
                    Last Update: ${data.last_update_age_sec ? data.last_update_age_sec + 's ago' : 'Pending'}
                `;
            } catch (e) { document.getElementById('status').innerText = "Error connecting to API."; }
        }

        async function loadHolders() {
            try {
                const res = await fetch(`${API_BASE}/api/holders?limit=100`);
                const data = await res.json();
                const tbody = document.getElementById('holders-table');
                tbody.innerHTML = "";
                
                let top10Sum = 0;
                let totalSum = 0;

                data.holders.forEach((holder, index) => {
                    if (index < 10) top10Sum += holder.amount;
                    totalSum += holder.amount;

                    const tr = document.createElement('tr');
                    // 6 decimals
                    const formattedAmount = (holder.amount / 1000000).toLocaleString(undefined, {maximumFractionDigits: 0});
                    tr.innerHTML = `
                        <td class="py-2 text-gray-500">${index + 1}</td>
                        <td class="py-2 font-mono text-xs"><a href="https://solscan.io/account/${holder.address}" target="_blank" class="hover:text-blue-400">${holder.address.slice(0, 4)}...${holder.address.slice(-4)}</a></td>
                        <td class="py-2 text-right text-green-400">${formattedAmount}</td>
                    `;
                    tbody.appendChild(tr);
                });

                renderChart(top10Sum, totalSum - top10Sum);
            } catch (e) { console.error(e); }
        }

        function renderChart(top10, rest) {
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('supplyChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Top 10 Whales', 'Rest of Holders'],
                    datasets: [{
                        data: [top10, rest],
                        backgroundColor: ['#3b82f6', '#1e293b'],
                        borderWidth: 0
                    }]
                },
                options: { plugins: { legend: { labels: { color: 'white' } } } }
            });
        }

        async function checkProof() {
            const address = document.getElementById('wallet-input').value.trim();
            const min = document.getElementById('min-input').value;
            const resultDiv = document.getElementById('proof-result');
            if (!address) return;

            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = "Verifying...";

            try {
                const res = await fetch(`${API_BASE}/api/prove?address=${address}&min=${min}`);
                const data = await res.json();
                
                if (data.status === "proven") {
                    resultDiv.innerHTML = `<h3 class="text-green-400 font-bold mb-1">✅ Proven</h3>
                        <p>Held for <strong>${data.duration_hours} hours</strong> continuously.</p>`;
                } else {
                    resultDiv.innerHTML = `<h3 class="text-red-400 font-bold mb-1">❌ Not Proven</h3>
                        <p>Did not hold minimum amount recently.</p>`;
                }
            } catch (e) { resultDiv.innerHTML = "Error checking."; }
        }

        loadStatus(); loadHolders();
        setInterval(() => { loadStatus(); loadHolders(); }, 60000); // Update every minute
    </script>
</body>
</html>
